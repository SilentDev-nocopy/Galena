; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; The ESP32 entry point lives in esp32/, not in src/, so that the two build
; targets are separate directories: esp32/ is the firmware, pc/ is the host.
; Everything both targets share sits in lib/ as a library, which PlatformIO
; compiles automatically.
[platformio]
src_dir = esp32

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11

build_flags =
    -std=gnu++17
    -frtti

; Regenerates lib/GalenaRuntime/src/generated_programs.hpp from programs/*.resy
; and lib/GalenaRuntime/src/generated_modules.hpp from
; lib/Resiris/modules/*.hpp before every build
extra_scripts =
    pre:scripts/generate_programs.py
    pre:scripts/generate_modules.py